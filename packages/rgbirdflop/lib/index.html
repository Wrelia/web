<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGBirdflop - Minecraft Text Color Gradients</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .description {
            color: #555;
            line-height: 1.6;
            margin: 30px 0;
            font-size: 1.05em;
        }
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .gradient-text {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }
        .features {
            margin-top: 40px;
            text-align: left;
            display: inline-block;
        }
        .feature {
            margin: 10px 0;
            color: #555;
        }
        .feature:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="gradient-text">RGBirdflop</span></h1>
        <p class="subtitle">Minecraft Text Color Gradients</p>
        
        <p class="description">
            A library for generating beautiful RGB color gradients for Minecraft server text.
        </p>

        <div class="features">
            <div class="feature">Generate smooth color gradients</div>
            <div class="feature">Support for multiple color formats</div>
            <div class="feature">Easy to use and integrate</div>
            <div class="feature">Minecraft compatible</div>
        </div>

        <div class="links">
            <a href="https://github.com/birdflop/web" class="btn-primary">GitHub Repository</a>
            <a href="https://birdflop.com/docs/rgbirdflop/npm_package/" class="btn-secondary">Documentation</a>
            <a href="https://www.birdflop.com" class="btn-secondary">Birdflop</a>
        </div>
    </div>
</body>
</html>
